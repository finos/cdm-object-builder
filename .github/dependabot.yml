version: 2

# No `registries:` block is needed. Maven dependencies resolve from Maven
# Central; npm dependencies resolve from the npm registry.

updates:
  # ------------------------------------------------------------------ setup --
  # Maven: setup/pom.xml is the only reactor, so one entry covers it.
  - package-ecosystem: maven
    directory: "/setup"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # CDM versions are bumped deliberately as part of release coordination,
    # not by a bot.
    # jackson-bom, xtext-dev-bom and guava are kept off minor/major bumps
    # entirely - only patch updates are allowed through, and standalone
    # rather than grouped. plexus-utils is pinned to fix a specific CVE
    # (see its dependencyManagement comment in setup/pom.xml) and shouldn't
    # move independently of that.
    ignore:
      - dependency-name: org.finos.cdm*
      - dependency-name: org.codehaus.plexus:plexus-utils
      - dependency-name: com.fasterxml.jackson*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: org.eclipse.xtext:xtext-dev-bom
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: com.google.guava:guava
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Guice stays on major version 6 - minor/patch updates are fine.
      - dependency-name: com.google.inject*
        update-types:
          - version-update:semver-major
    # One PR for routine minor/patch drift; majors still come through
    # individually so they get read properly.
    groups:
      maven-minor-and-patch:
        exclude-patterns:
          - com.fasterxml.jackson*
          - org.eclipse.xtext:xtext-dev-bom
          - com.google.guava:guava
        update-types:
          - minor
          - patch

  # --------------------------------------------------------------------- ui --
  # npm: the Angular app.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
